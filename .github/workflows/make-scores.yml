name: compile-all-scores
run-name: Compiling lilypond scores for Cyprus Choir Club
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build in dev container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -eu
            rm -rf build web/dist
            python3 tools/build_logo.py --check
            python3 tools/build_logo.py
            lilypond *.ly
            ~/.venv/bin/python tools/build_midi.py
            ~/.venv/bin/python tools/build_media.py
            npm --prefix web run build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
