name: compile-all-scores
run-name: Compiling lilypond scores for Cyprus Choir Club
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build in dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -eu
            rm -rf build web/dist
            python3 tools/build_logo.py --check
            python3 tools/build_logo.py
            lilypond *.ly
            ~/.venv/bin/python tools/build_midi.py
            ~/.venv/bin/python tools/build_media.py
            npm --prefix web run build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Upload Cloudflare Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: web/dist
          retention-days: 1

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v5
        with:
          name: cloudflare-pages
          path: site/scores
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
