name: compile-all-scores
run-name: Compiling lilypond scores for Cyprus Choir Club
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install renderer and Jost
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/jost/Jost%5Bwght%5D.ttf' \
            --output "$HOME/.local/share/fonts/Jost.ttf"
          fc-cache --force
          google-chrome --version
          pdftops -v
          fc-match Jost | grep --ignore-case jost
      - name: Generate standalone SVG variants
        run: python3 tools/export-logo-variants.py include/cyprus-choral-club.svg build/logo
      - name: Export print and raster formats
        run: python3 tools/render-logo-formats.py build/logo --font "$HOME/.local/share/fonts/Jost.ttf"

      - name: Use compact logo in scores
        run: cp build/logo/cyprus-choral-club-compact.eps include/cyprus-choral-club.eps

      - name: Restore compiled scores
        id: scores-cache
        uses: actions/cache@v4
        with:
          path: |
            ./*.pdf
            ./*.midi
          key: scores-v4-${{ runner.os }}-${{ hashFiles('*.ly', 'include/*.ly', 'include/cyprus-choral-club.svg', 'tools/export-logo-variants.py', 'tools/render-logo-formats.py') }}

      - name: Restore rendered audio
        id: audio-cache
        uses: actions/cache@v4
        with:
          path: ./*.mp3
          key: audio-v1-${{ runner.os }}-${{ hashFiles('*.ly', 'include/*.ly') }}

      - uses: codello/setup-lilypond@main
        if: steps.scores-cache.outputs.cache-hit != 'true'
        with:
          lilypond-version: 2.24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 mido
      - name: Install MIDI renderer
        if: steps.audio-cache.outputs.cache-hit != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: vlc vlc-plugin-fluidsynth fluid-soundfont-gs
          version: 1.0
          execute_install_scripts: true
      - name: Build Lilypond scores
        if: steps.scores-cache.outputs.cache-hit != 'true'
        run: lilypond *.ly
      - name: Generate index pages
        run: python3 pages/generate_static.py
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
        working-directory: web
      - name: Compile vite app
        run: npm run build
        working-directory: web
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
